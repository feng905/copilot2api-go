services:
  copilot-go:
    image: hub.metami.work/copilot-go/copilot-go:latest
    container_name: copilot-go
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web Console
      - "4141:4141"   # Proxy
    volumes:
      - copilot-data:/root/.local/share/copilot-api
    environment:
      - TZ=Asia/Shanghai

volumes:
  copilot-data:
    driver: local
